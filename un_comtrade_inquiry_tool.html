<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UN Comtrade Downloader</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f5f2;
        --panel: #ffffff;
        --ink: #202421;
        --muted: #66706a;
        --line: #dce2dc;
        --soft: #eef2ed;
        --accent: #0f6b57;
        --accent-dark: #0b4f41;
        --error: #a33f3f;
        --warn: #a45d18;
        --shadow: 0 18px 55px rgba(32, 42, 35, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(125deg, rgba(15, 107, 87, 0.08), transparent 42%),
          var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select {
        font: inherit;
        letter-spacing: 0;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.42fr);
        gap: 18px;
        width: min(1180px, calc(100vw - 32px));
        min-height: calc(100vh - 32px);
        margin: 16px auto;
      }

      .panel {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .form-panel {
        padding: 28px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 22px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 780;
        text-transform: uppercase;
      }

      h1,
      h2 {
        margin: 0;
        line-height: 1.1;
      }

      h1 {
        font-size: clamp(1.9rem, 3vw, 2.7rem);
      }

      h2 {
        font-size: 1.08rem;
      }

      .mark {
        display: grid;
        grid-template-columns: repeat(3, 14px);
        gap: 5px;
        align-items: end;
        width: 62px;
        height: 50px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      .mark span {
        display: block;
        width: 100%;
        border-radius: 999px;
        background: var(--accent);
      }

      .mark span:nth-child(1) {
        height: 16px;
      }

      .mark span:nth-child(2) {
        height: 28px;
      }

      .mark span:nth-child(3) {
        height: 22px;
      }

      form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 7px;
        min-width: 0;
      }

      .field-wide {
        grid-column: 1 / -1;
      }

      .field span,
      legend {
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 720;
      }

      input,
      select {
        width: 100%;
        min-height: 46px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fbfcfa;
        color: var(--ink);
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(15, 107, 87, 0.14);
      }

      fieldset {
        margin: 0;
        padding: 0;
        border: 0;
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 46px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fbfcfa;
      }

      .segmented label {
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .segmented label + label {
        border-left: 1px solid var(--line);
      }

      .segmented input {
        position: absolute;
        opacity: 0;
      }

      .segmented span {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
      }

      .segmented input:checked + span {
        color: #ffffff;
        background: var(--accent);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding-top: 8px;
      }

      button,
      .download-link {
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        font-weight: 780;
        text-decoration: none;
      }

      button:hover,
      .download-link:hover {
        background: var(--accent-dark);
      }

      button.secondary {
        border-color: var(--line);
        background: #ffffff;
        color: var(--ink);
      }

      button.secondary:hover {
        background: var(--soft);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.68;
      }

      .status-panel {
        display: flex;
        flex-direction: column;
        min-height: 360px;
        padding: 22px;
      }

      .status-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .badge {
        padding: 5px 9px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 760;
      }

      .badge.running {
        background: rgba(164, 93, 24, 0.14);
        color: var(--warn);
      }

      .badge.done {
        background: rgba(15, 107, 87, 0.14);
        color: var(--accent);
      }

      .badge.error {
        background: rgba(163, 63, 63, 0.14);
        color: var(--error);
      }

      .log {
        flex: 1;
        min-height: 280px;
        padding: 14px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fbfcfa;
        color: #303632;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.88rem;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .download-link {
        display: grid;
        place-items: center;
        margin-top: 14px;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .app {
          width: min(100vw - 18px, 1180px);
          margin: 9px auto;
        }

        .form-panel,
        .status-panel {
          padding: 18px;
        }

        form {
          grid-template-columns: 1fr;
        }

        .actions {
          flex-direction: column-reverse;
        }

        button,
        .download-link {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="panel form-panel">
        <div class="header">
          <div>
            <p class="eyebrow">Static browser app</p>
            <h1>UN Comtrade Downloader</h1>
          </div>
          <div class="mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <form id="downloadForm">
          <label class="field field-wide">
            <span>API key</span>
            <input id="apiKey" name="apiKey" type="password" autocomplete="off" />
          </label>

          <label class="field">
            <span>Reporter</span>
            <select id="reporter" name="reporter"></select>
          </label>

          <label class="field">
            <span>Partner</span>
            <select id="partner" name="partner"></select>
          </label>

          <label class="field">
            <span>Flow</span>
            <select id="flow" name="flow">
              <option value="M">Import</option>
              <option value="X">Export</option>
              <option value="RX">Re-export</option>
              <option value="RM">Re-import</option>
            </select>
          </label>

          <fieldset class="field">
            <legend>Frequency</legend>
            <div class="segmented">
              <label>
                <input type="radio" name="frequency" value="A" checked />
                <span>Annual</span>
              </label>
              <label>
                <input type="radio" name="frequency" value="M" />
                <span>Monthly</span>
              </label>
            </div>
          </fieldset>

          <label class="field">
            <span id="startLabel">Start year</span>
            <input id="start" name="start" inputmode="numeric" />
          </label>

          <label class="field">
            <span id="endLabel">End year</span>
            <input id="end" name="end" inputmode="numeric" />
          </label>

          <label class="field">
            <span>HS code(s)</span>
            <input id="hsCodes" name="hsCodes" value="TOTAL" />
          </label>

          <label class="field">
            <span>Min volume</span>
            <input id="minVolume" name="minVolume" inputmode="decimal" />
          </label>

          <label class="field">
            <span>Min USD value</span>
            <input id="minUsd" name="minUsd" inputmode="decimal" />
          </label>

          <label class="field">
            <span>CSV filename</span>
            <input id="filename" name="filename" value="uncomtrade_dataset.csv" />
          </label>

          <div class="actions field-wide">
            <button id="sampleButton" class="secondary" type="button">Use Sample</button>
            <button id="downloadButton" type="submit">Download CSV</button>
          </div>
        </form>
      </section>

      <aside class="panel status-panel">
        <div class="status-heading">
          <h2>Status</h2>
          <span id="statusBadge" class="badge">Ready</span>
        </div>
        <div id="statusLog" class="log" aria-live="polite"></div>
        <a id="downloadLink" class="download-link hidden" href="#">Download file</a>
      </aside>
    </main>

    <script>
      const DEFAULT_API_KEY = "26ea3b22ccfc4609ae9e263cc614fbe9";
      const API_BASE = "https://comtradeapi.un.org/data/v1/get/C";

      const COUNTRY_CODES = {
        Afghanistan: "4",
        Algeria: "12",
        Angola: "24",
        Argentina: "32",
        Australia: "36",
        Austria: "40",
        Bangladesh: "50",
        Belgium: "56",
        Bolivia: "68",
        Brazil: "76",
        Cambodia: "116",
        Canada: "124",
        Chile: "152",
        China: "156",
        Colombia: "170",
        Czechia: "203",
        Denmark: "208",
        Ecuador: "218",
        Egypt: "818",
        Ethiopia: "231",
        Finland: "246",
        France: "251",
        Germany: "276",
        Ghana: "288",
        Greece: "300",
        "Hong Kong": "344",
        Hungary: "348",
        India: "699",
        Indonesia: "360",
        Iran: "364",
        Ireland: "372",
        Israel: "376",
        Italy: "381",
        Japan: "392",
        Kazakhstan: "398",
        Kenya: "404",
        Kuwait: "414",
        Kyrgyzstan: "417",
        Malaysia: "458",
        Mexico: "484",
        Morocco: "504",
        Netherlands: "528",
        "New Zealand": "554",
        Nigeria: "566",
        Norway: "579",
        Oman: "512",
        Pakistan: "586",
        Peru: "604",
        Philippines: "608",
        Poland: "616",
        Portugal: "620",
        Qatar: "634",
        Romania: "642",
        Russia: "643",
        "Saudi Arabia": "682",
        Singapore: "702",
        Slovakia: "703",
        Slovenia: "705",
        "South Africa": "710",
        "South Korea": "410",
        Spain: "724",
        "Sri Lanka": "144",
        Sweden: "752",
        Switzerland: "756",
        Taiwan: "490",
        Tajikistan: "762",
        Thailand: "764",
        Turkey: "792",
        Turkmenistan: "795",
        Ukraine: "804",
        "United Arab Emirates": "784",
        "United Kingdom": "826",
        "United States": "842",
        USA: "842",
        Uruguay: "858",
        Uzbekistan: "860",
        Venezuela: "862",
        "Viet Nam": "704",
      };

      const COUNTRY_NAMES = Object.keys(COUNTRY_CODES);
      const form = document.querySelector("#downloadForm");
      const statusLog = document.querySelector("#statusLog");
      const statusBadge = document.querySelector("#statusBadge");
      const downloadButton = document.querySelector("#downloadButton");
      const downloadLink = document.querySelector("#downloadLink");
      const sampleButton = document.querySelector("#sampleButton");
      const startInput = document.querySelector("#start");
      const endInput = document.querySelector("#end");
      const startLabel = document.querySelector("#startLabel");
      const endLabel = document.querySelector("#endLabel");

      function appendLog(message) {
        statusLog.textContent += `${message}\n`;
        statusLog.scrollTop = statusLog.scrollHeight;
      }

      function setStatus(label, state = "") {
        statusBadge.textContent = label;
        statusBadge.className = `badge ${state}`.trim();
      }

      function fillSelect(select, values, selected) {
        select.replaceChildren(
          ...values.map((value) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            option.selected = value === selected;
            return option;
          }),
        );
      }

      function currentFrequency() {
        return document.querySelector('input[name="frequency"]:checked').value;
      }

      function updateDateFields() {
        const year = new Date().getFullYear() - 1;
        if (currentFrequency() === "M") {
          startLabel.textContent = "Start month";
          endLabel.textContent = "End month";
          startInput.placeholder = "YYYY-MM";
          endInput.placeholder = "YYYY-MM";
          if (/^\d{4}$/.test(startInput.value)) startInput.value = `${year}-01`;
          if (/^\d{4}$/.test(endInput.value)) endInput.value = `${year}-12`;
        } else {
          startLabel.textContent = "Start year";
          endLabel.textContent = "End year";
          startInput.placeholder = "YYYY";
          endInput.placeholder = "YYYY";
          if (startInput.value.includes("-")) startInput.value = startInput.value.slice(0, 4);
          if (endInput.value.includes("-")) endInput.value = endInput.value.slice(0, 4);
        }
      }

      function parseNumber(value, label) {
        const cleaned = String(value || "").replaceAll(",", "").trim();
        if (!cleaned) return null;
        const number = Number(cleaned);
        if (!Number.isFinite(number)) throw new Error(`${label} must be a number.`);
        return number;
      }

      function normalizeHsCodes(value) {
        const cleaned = String(value || "TOTAL").toUpperCase().replaceAll(" ", "");
        const codes = cleaned.split(",");
        const invalid = codes.filter((code) => !/^(TOTAL|\d{1,6})$/.test(code));
        if (invalid.length) throw new Error("HS codes must be TOTAL or comma-separated 1-6 digit codes.");
        return codes.join(",");
      }

      function periods(freq, start, end) {
        const output = [];
        if (freq === "A") {
          if (!/^\d{4}$/.test(start) || !/^\d{4}$/.test(end)) {
            throw new Error("Annual dates must use YYYY.");
          }
          for (let year = Number(start); year <= Number(end); year += 1) output.push(String(year));
        } else {
          if (!/^\d{4}-\d{2}$/.test(start) || !/^\d{4}-\d{2}$/.test(end)) {
            throw new Error("Monthly dates must use YYYY-MM.");
          }
          let [year, month] = start.split("-").map(Number);
          const [endYear, endMonth] = end.split("-").map(Number);
          if (month < 1 || month > 12 || endMonth < 1 || endMonth > 12) {
            throw new Error("Monthly dates must use a month from 01 to 12.");
          }
          while (year < endYear || (year === endYear && month <= endMonth)) {
            output.push(`${year}${String(month).padStart(2, "0")}`);
            month += 1;
            if (month === 13) {
              year += 1;
              month = 1;
            }
          }
        }
        if (!output.length) throw new Error("The date range is empty.");
        return output;
      }

      function queryUrl(payload, period) {
        const params = new URLSearchParams({
          reporterCode: COUNTRY_CODES[payload.reporter],
          flowCode: payload.flow,
          period,
          cmdCode: payload.hsCodes,
          maxRecords: "250000",
          format: "JSON",
          breakdownMode: "classic",
          includeDesc: "True",
          "subscription-key": payload.apiKey,
        });
        if (payload.partner !== "All") params.set("partnerCode", COUNTRY_CODES[payload.partner]);
        return `${API_BASE}/${payload.frequency}/HS?${params.toString()}`;
      }

      async function fetchPeriod(payload, period, index, total) {
        appendLog(`Downloading ${period} (${index}/${total})...`);
        const response = await fetch(queryUrl(payload, period));
        if (!response.ok) {
          throw new Error(`UN Comtrade returned ${response.status}: ${await response.text()}`);
        }
        const body = await response.json();
        const rows = Array.isArray(body.data) ? body.data : Array.isArray(body) ? body : [];
        appendLog(`Received ${rows.length.toLocaleString()} rows for ${period}.`);
        return rows;
      }

      function applyFilters(rows, minVolume, minUsd) {
        return rows.filter((row) => {
          const usd = Number(row.primaryValue ?? row.TradeValue ?? 0);
          const volume = Number(row.netWgt ?? row.netWgtKg ?? row.qty ?? row.altQty ?? 0);
          if (minUsd !== null && usd < minUsd) return false;
          if (minVolume !== null && volume < minVolume) return false;
          return true;
        });
      }

      function orderedColumns(rows) {
        const preferred = [
          "period",
          "reporterCode",
          "reporterDesc",
          "flowCode",
          "flowDesc",
          "partnerCode",
          "partnerDesc",
          "cmdCode",
          "cmdDesc",
          "qtyUnitCode",
          "qtyUnitAbbr",
          "qty",
          "altQtyUnitCode",
          "altQtyUnitAbbr",
          "altQty",
          "netWgt",
          "grossWgt",
          "primaryValue",
        ];
        const seen = new Set();
        for (const row of rows) {
          for (const key of Object.keys(row)) seen.add(key);
        }
        return [...preferred.filter((key) => seen.has(key)), ...[...seen].filter((key) => !preferred.includes(key))];
      }

      function csvEscape(value) {
        if (value === null || value === undefined) return "";
        const text = String(value);
        if (/[",\n\r]/.test(text)) return `"${text.replaceAll('"', '""')}"`;
        return text;
      }

      function rowsToCsv(rows) {
        const columns = orderedColumns(rows);
        const lines = [columns.map(csvEscape).join(",")];
        for (const row of rows) lines.push(columns.map((column) => csvEscape(row[column])).join(","));
        return lines.join("\n");
      }

      function downloadCsv(csv, filename) {
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        downloadLink.href = url;
        downloadLink.download = filename;
        downloadLink.textContent = `Download ${filename}`;
        downloadLink.classList.remove("hidden");
      }

      function filename(value) {
        const cleaned = String(value || "uncomtrade_dataset.csv")
          .replace(/[^A-Za-z0-9._-]+/g, "_")
          .replace(/^[._]+|[._]+$/g, "");
        const safeName = cleaned || "uncomtrade_dataset";
        return safeName.toLowerCase().endsWith(".csv") ? safeName : `${safeName}.csv`;
      }

      function payloadFromForm() {
        const data = new FormData(form);
        const payload = {
          apiKey: String(data.get("apiKey") || "").trim(),
          reporter: data.get("reporter"),
          partner: data.get("partner"),
          flow: data.get("flow"),
          frequency: currentFrequency(),
          hsCodes: normalizeHsCodes(data.get("hsCodes")),
          start: String(data.get("start") || "").trim(),
          end: String(data.get("end") || "").trim(),
          minVolume: parseNumber(data.get("minVolume"), "Min volume"),
          minUsd: parseNumber(data.get("minUsd"), "Min USD value"),
          filename: filename(data.get("filename")),
        };
        if (!payload.apiKey) throw new Error("Enter a UN Comtrade API key.");
        if (!COUNTRY_CODES[payload.reporter]) throw new Error("Choose a reporter country.");
        if (payload.partner !== "All" && !COUNTRY_CODES[payload.partner]) throw new Error("Choose a partner country.");
        payload.periods = periods(payload.frequency, payload.start, payload.end);
        return payload;
      }

      async function handleSubmit(event) {
        event.preventDefault();
        statusLog.textContent = "";
        downloadLink.classList.add("hidden");
        downloadButton.disabled = true;
        setStatus("Running", "running");

        try {
          const payload = payloadFromForm();
          const frames = [];
          for (let i = 0; i < payload.periods.length; i += 1) {
            frames.push(...(await fetchPeriod(payload, payload.periods[i], i + 1, payload.periods.length)));
          }
          const rows = applyFilters(frames, payload.minVolume, payload.minUsd);
          if (!rows.length) {
            setStatus("No records", "done");
            appendLog("No records returned for this query.");
            return;
          }
          downloadCsv(rowsToCsv(rows), payload.filename);
          setStatus("Complete", "done");
          appendLog(`Prepared ${rows.length.toLocaleString()} rows.`);
        } catch (error) {
          setStatus("Error", "error");
          appendLog(`Error: ${error.message}`);
          appendLog("If this is a browser CORS error, UN Comtrade is blocking direct browser requests for your environment.");
        } finally {
          downloadButton.disabled = false;
        }
      }

      function useSample() {
        document.querySelector("#reporter").value = "United States";
        document.querySelector("#partner").value = "China";
        document.querySelector("#flow").value = "M";
        document.querySelector("#hsCodes").value = "284200";
        document.querySelector("#filename").value = "uncomtrade_sample.csv";
      }

      function initialize() {
        const previousKey = localStorage.getItem("uncomtrade_api_key") || DEFAULT_API_KEY;
        document.querySelector("#apiKey").value = previousKey;
        fillSelect(document.querySelector("#reporter"), COUNTRY_NAMES, "USA");
        fillSelect(document.querySelector("#partner"), ["All", ...COUNTRY_NAMES], "All");
        const lastYear = new Date().getFullYear() - 1;
        startInput.value = String(lastYear);
        endInput.value = String(lastYear);
        updateDateFields();
        appendLog("Ready.");
      }

      document.querySelectorAll('input[name="frequency"]').forEach((input) => {
        input.addEventListener("change", updateDateFields);
      });
      document.querySelector("#apiKey").addEventListener("change", (event) => {
        localStorage.setItem("uncomtrade_api_key", event.target.value);
      });
      form.addEventListener("submit", handleSubmit);
      sampleButton.addEventListener("click", useSample);
      initialize();
    </script>
  </body>
</html>
